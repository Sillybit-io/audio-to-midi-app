      - heading "Sound in, notes out." [level=1] [ref=e8]
      - paragraph [ref=e9]: The waveform on the left turns into piano-roll notes that climb to the right, which is exactly what the app does. The four notes use the app’s instrument colours (piano, strings, guitar, voice), so the icon matches the piano roll you see after a transcription. A deep navy base keeps the colours bright in the Dock in both light and dark mode.
